name: Dependabot auto-merge
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.id == 49699333 # dependabot[bot]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # GITHUB_TOKEN is not allowed to push to the protected main branch, so
      # enabling auto-merge requires a token whose user may merge into main.
      # Majors stay manual.
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_DEPENDABOT_JS_PY }}
